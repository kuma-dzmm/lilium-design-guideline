<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shell.css"></head>
<body style="padding:20px 24px">
<div class="row" style="gap:14px; align-items:flex-end;">
  <div style="text-align:center;">
    <div style="width:72px; height:72px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:6px;"></div>
    <div style="margin-top:8px; font-size:11px;">sm · 6</div>
    <div class="muted" style="font-size:10px;">tiny chips</div>
  </div>
  <div style="text-align:center;">
    <div style="width:72px; height:72px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px;"></div>
    <div style="margin-top:8px; font-size:11px;">md · 8</div>
    <div class="muted" style="font-size:10px;">btn / input</div>
  </div>
  <div style="text-align:center;">
    <div style="width:72px; height:72px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:10px;"></div>
    <div style="margin-top:8px; font-size:11px;">lg · 10</div>
    <div class="muted" style="font-size:10px;">row / badge</div>
  </div>
  <div style="text-align:center;">
    <div style="width:72px; height:72px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:12px;"></div>
    <div style="margin-top:8px; font-size:11px;">xl · 12</div>
    <div class="muted" style="font-size:10px;">card / modal</div>
  </div>
  <div style="text-align:center;">
    <div style="width:72px; height:72px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:9999px;"></div>
    <div style="margin-top:8px; font-size:11px;">pill · full</div>
    <div class="muted" style="font-size:10px;">avatar / dot</div>
  </div>
</div>
</body></html>

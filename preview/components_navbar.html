<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shell.css"></head>
<body style="padding:0; overflow:hidden;">
<div style="height:56px; background:var(--bg-secondary); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 16px; gap:16px;">
  <div style="display:flex; align-items:center; gap:6px; font-weight:600;">🐻 <span>ToolBear</span></div>
  <div style="display:flex; gap:4px; margin-left:8px;">
    <a style="padding:6px 10px; border-radius:8px; background:rgba(255,90,138,0.15); color:#ff5a8a; font-size:13px; font-weight:500;">大头菜</a>
    <a style="padding:6px 10px; border-radius:8px; color:var(--fg-secondary); font-size:13px;">股票</a>
    <a style="padding:6px 10px; border-radius:8px; color:var(--fg-secondary); font-size:13px;">钱包</a>
    <a style="padding:6px 10px; border-radius:8px; color:var(--fg-secondary); font-size:13px; background:var(--bg-tertiary);">帕鲁</a>
    <a style="padding:6px 10px; border-radius:8px; color:var(--fg-secondary); font-size:13px;">交易行</a>
    <a style="padding:6px 10px; border-radius:8px; color:var(--fg-secondary); font-size:13px;">游戏</a>
  </div>
  <div style="margin-left:auto; display:flex; align-items:center; gap:12px;">
    <span style="display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--fg-secondary);"><span style="width:8px; height:8px; border-radius:50%; background:#3fb950;"></span> 正常</span>
    <div style="width:32px; height:32px; border-radius:50%; background:var(--bg-tertiary); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:var(--fg-secondary);">KS</div>
  </div>
</div>
</body></html>

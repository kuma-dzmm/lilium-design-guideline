<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shell.css"></head>
<body style="padding:18px 20px">
<div class="grid" style="grid-template-columns: repeat(4, 1fr); gap:10px;">
  <div>
    <div style="height:64px; border-radius:10px; background:#0f0f12; border:1px solid var(--border);"></div>
    <div style="margin-top:8px; font-size:12px;">bg-primary</div>
    <div class="mono muted" style="font-size:11px;">#0F0F12</div>
  </div>
  <div>
    <div style="height:64px; border-radius:10px; background:#1a1a21; border:1px solid var(--border);"></div>
    <div style="margin-top:8px; font-size:12px;">bg-secondary</div>
    <div class="mono muted" style="font-size:11px;">#1A1A21</div>
  </div>
  <div>
    <div style="height:64px; border-radius:10px; background:#252530; border:1px solid var(--border);"></div>
    <div style="margin-top:8px; font-size:12px;">bg-tertiary</div>
    <div class="mono muted" style="font-size:11px;">#252530</div>
  </div>
  <div>
    <div style="height:64px; border-radius:10px; background:#0f0f12; border:1px solid #32323e;"></div>
    <div style="margin-top:8px; font-size:12px;">border</div>
    <div class="mono muted" style="font-size:11px;">#32323E</div>
  </div>
</div>
</body></html>

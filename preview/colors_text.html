<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shell.css"></head>
<body style="padding:18px 20px">
<div class="grid" style="grid-template-columns: repeat(3, 1fr); gap:10px;">
  <div>
    <div style="height:56px; border-radius:10px; background:#e8e8ec; border:1px solid var(--border);"></div>
    <div style="margin-top:8px; font-size:12px;">fg-primary</div>
    <div class="mono muted" style="font-size:11px;">#E8E8EC</div>
  </div>
  <div>
    <div style="height:56px; border-radius:10px; background:#8e8e9d; border:1px solid var(--border);"></div>
    <div style="margin-top:8px; font-size:12px;">fg-secondary</div>
    <div class="mono muted" style="font-size:11px;">#8E8E9D</div>
  </div>
  <div>
    <div style="height:56px; border-radius:10px; background:rgba(142,142,157,0.6); border:1px solid var(--border);"></div>
    <div style="margin-top:8px; font-size:12px;">placeholder</div>
    <div class="mono muted" style="font-size:11px;">fg-sec @ 60%</div>
  </div>
</div>
</body></html>

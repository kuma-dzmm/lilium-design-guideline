<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shell.css"></head>
<body style="padding:18px 20px">
<div class="grid" style="grid-template-columns: repeat(5, 1fr); gap:10px;">
  <div>
    <div style="height:64px; border-radius:10px; background:#ff5a8a;"></div>
    <div style="margin-top:8px; font-size:12px;">accent</div>
    <div class="mono muted" style="font-size:11px;">#FF5A8A</div>
  </div>
  <div>
    <div style="height:64px; border-radius:10px; background:#3fb950;"></div>
    <div style="margin-top:8px; font-size:12px;">success</div>
    <div class="mono muted" style="font-size:11px;">#3FB950</div>
  </div>
  <div>
    <div style="height:64px; border-radius:10px; background:#ff3860;"></div>
    <div style="margin-top:8px; font-size:12px;">danger</div>
    <div class="mono muted" style="font-size:11px;">#FF3860</div>
  </div>
  <div>
    <div style="height:64px; border-radius:10px; background:#58a6ff;"></div>
    <div style="margin-top:8px; font-size:12px;">info</div>
    <div class="mono muted" style="font-size:11px;">#58A6FF</div>
  </div>
  <div>
    <div style="height:64px; border-radius:10px; background:#d29922;"></div>
    <div style="margin-top:8px; font-size:12px;">warning</div>
    <div class="mono muted" style="font-size:11px;">#D29922</div>
  </div>
</div>
</body></html>

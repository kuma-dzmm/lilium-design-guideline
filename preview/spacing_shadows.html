<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shell.css"></head>
<body style="padding:24px 24px">
<div class="row" style="gap:18px;">
  <div style="text-align:center;">
    <div style="width:96px; height:68px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:10px; box-shadow: 0 1px 2px rgba(0,0,0,0.25);"></div>
    <div style="margin-top:8px; font-size:11px;">sm</div>
    <div class="muted" style="font-size:10px;">subtle</div>
  </div>
  <div style="text-align:center;">
    <div style="width:96px; height:68px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.4), 0 2px 4px -2px rgba(0,0,0,0.3);"></div>
    <div style="margin-top:8px; font-size:11px;">md</div>
    <div class="muted" style="font-size:10px;">rarely used</div>
  </div>
  <div style="text-align:center;">
    <div style="width:96px; height:68px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:10px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5), 0 4px 6px -4px rgba(0,0,0,0.4);"></div>
    <div style="margin-top:8px; font-size:11px;">lg</div>
    <div class="muted" style="font-size:10px;">popovers</div>
  </div>
  <div style="text-align:center;">
    <div style="width:96px; height:68px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);"></div>
    <div style="margin-top:8px; font-size:11px;">modal</div>
    <div class="muted" style="font-size:10px;">dialogs</div>
  </div>
</div>
</body></html>
